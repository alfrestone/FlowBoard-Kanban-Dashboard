<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./js/main.js" defer></script>
    <link rel="stylesheet" href="css/style.css">

    <title>FlowBoard</title>
</head>

<body class="bg-base-200 min-h-screen pb-8">

    <header class="flex flex-wrap justify-between items-center gap-3 bg-base-100 shadow-sm px-4 sm:px-6 py-4">
        <a class="text-xl sm:text-2xl font-extrabold tracking-tight text-primary">FlowBoard</a>
        <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto justify-end">
            <button id="btn-open-modal" class="btn btn-primary btn-sm sm:btn-md flex-1 sm:flex-none" onclick="modal_add_card.showModal()">
                + Nouvelle carte
            </button>
            <button id="btn-open-ai-modal" class="btn btn-secondary btn-sm sm:btn-md flex-1 sm:flex-none" onclick="modal_ai.showModal()">
                ✨ Générer avec l'IA
            </button>
            <label class="swap swap-rotate btn btn-ghost btn-circle btn-sm sm:btn-md">
                <input id="btn-theme" type="checkbox" />

                <svg class="swap-off h-6 w-6 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z" />
                </svg>

                <svg class="swap-on h-6 w-6 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z" />
                </svg>
            </label>
        </div>
    </header>

    <section class="flex gap-2 p-4 bg-base-100 mx-4 my-4 max-w-7xl lg:mx-auto rounded-xl shadow-sm items-center flex-wrap">
        <label class="input input-bordered flex items-center gap-2 w-full sm:w-auto sm:flex-1">
            <svg class="h-[1em] opacity-50 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                </g>
            </svg>
            <input id="filter-search" type="search" class="w-full grow" placeholder="Search" />
        </label>

        <select id="filter-priority" class="select select-bordered flex-1 sm:flex-none">
            <option value="">Toutes</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>

        <select id="filter-assignee" class="select select-bordered flex-1 sm:flex-none">
            <option value="">Tous</option>
        </select>

        <button id="btn-reset" class="btn btn-ghost w-full sm:w-auto">Réinitialiser</button>
    </section>

    <div id="state-loading" class="hidden flex justify-center p-8">
        <span class="loading loading-spinner loading-lg"></span>
    </div>

    <div id="state-error" class="hidden max-w-lg mx-auto my-4 px-4">
        <div role="alert" class="alert alert-error">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <div class="flex flex-wrap w-full items-center justify-between gap-4">
                <span id="error-message">Impossible de charger les cartes.</span>
                <button id="btn-retry" type="button" class="btn btn-sm">Réessayer</button>
            </div>
        </div>
    </div>

    <p id="state-empty" class="hidden text-center p-8 text-lg opacity-70">
        Aucune carte ne correspond à vos filtres
    </p>

    <main id="board" class="hidden grid max-w-7xl mx-auto px-4 gap-4 md:gap-6 grid-cols-1 md:grid-cols-3">
        <section class="bg-base-100 sm:bg-base-200 p-4 rounded-xl shadow-sm min-h-0 md:min-h-[500px] border-t-4 border-slate-400">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold">To Do</h2>
                <span id="count-todo" class="badge badge-neutral">0</span>
                <button id="btn-collapse-todo" class="btn btn-xs btn-ghost">▼</button>
            </div>

            <div id="col-todo" class="flex flex-col gap-3"></div>
        </section>

        <section class="bg-base-100 sm:bg-base-200 p-4 rounded-xl shadow-sm min-h-0 md:min-h-[500px] border-t-4 border-info">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold">In Progress</h2>
                <span id="count-in-progress" class="badge badge-info">0</span>
                <button id="btn-collapse-progress" class="btn btn-xs btn-ghost">▼</button>
            </div>

            <div id="col-in-progress" class="flex flex-col gap-3"></div>
        </section>

        <section class="bg-base-100 sm:bg-base-200 p-4 rounded-xl shadow-sm min-h-0 md:min-h-[500px] border-t-4 border-success">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold">Done</h2>
                <span id="count-done" class="badge badge-success text-white">0</span>
                <button id="btn-collapse-done" class="btn btn-xs btn-ghost">▼</button>
            </div>
            <div id="col-done" class="flex flex-col gap-3"></div>
        </section>
    </main>

    <dialog id="modal_add_card" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box">
            <h3 class="font-bold text-lg pb-4">Nouvelle carte</h3>
            <form id="form-add-card" class="flex flex-col gap-3">
                <input id="input-title" type="text" placeholder="Titre" class="input input-bordered w-full" />
                <textarea id="input-description" class="textarea textarea-bordered w-full"
                    placeholder="Description"></textarea>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <select id="input-status" class="select select-bordered w-full">
                        <option value="todo">todo</option>
                        <option value="in-progress">in-progress</option>
                        <option value="done">done</option>
                    </select>

                    <select id="input-priority" class="select select-bordered w-full">
                        <option value="low">low</option>
                        <option value="medium">medium</option>
                        <option value="high">high</option>
                    </select>
                </div>

                <input id="input-assignee" type="text" placeholder="Assigné à"
                    class="input input-bordered w-full" />
                <input id="input-duedate" type="date" class="input input-bordered w-full">
                <input id="input-tags" type="text" placeholder="Tags (ex: front, api)"
                    class="input input-bordered w-full">

                <p id="form-error" class="hidden text-error text-sm"></p>

                <button type="submit" class="btn btn-primary w-full" id="btn-add-submit">Ajouter</button>
                <button type="submit" class="hidden btn btn-primary w-full" id="btn-edit-submit">Modifier</button>
                <button type="button" id="btn-close-modal" class="btn w-full"
                    onclick="modal_add_card.close()">Annuler</button>
            </form>
        </div>
    </dialog>

    <dialog id="modal_ai" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box">
            <h3 class="font-bold text-lg">✨ Générer des cartes avec Gemini IA</h3>
            <form id="form-ai" class="flex flex-col gap-4 mt-4">
                <div>
                    <label class="label mb-4">Description du projet (20 à 1000 caractères) :</label>
                    <textarea id="input-ai-description" class="textarea textarea-bordered w-full" rows="4"
                        placeholder="Décrivez votre projet en détail..."></textarea>
                </div>
                <div>
                    <label class="label mb-4">Clé API Gemini :</label>
                    <input id="input-ai-key" type="password" class="input input-bordered w-full"
                        placeholder="AIzaSy..." />
                </div>
                <p id="ai-form-error" class="text-red-500 text-sm hidden"></p>
                <div class="modal-action">
                    <button type="button" class="btn" onclick="modal_ai.close()">Annuler</button>
                    <button id="btn-ai-submit" type="submit" class="btn btn-secondary">Générer</button>
                </div>
            </form>
        </div>
    </dialog>

</body>

</html>
